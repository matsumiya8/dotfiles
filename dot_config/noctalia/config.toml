[bar.default]
background_opacity = 0.88
center = [ "media" ]
end = [ "privacy", "group:g3" ]
font_family = "IBM Plex Sans JP"
margin_edge = 0
margin_ends = 0
padding = 8
position = "bottom"
radius = 0
scale = 1.05
shadow = false
start = [ "launcher", "workspaces", "group:g4" ]
thickness = 40
widget_spacing = 8

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g2"
    members = [ "media", "volume" ]
    opacity = 0.6
    padding = 8.0

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g3"
    members = [ "tray", "bluetooth", "volume", "notifications", "notes", "clock" ]
    opacity = 0.6
    padding = 6.0

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g4"
    members = [ "weather", "bar" ]
    opacity = 0.6
    padding = 6.0

[control_center]
show_shortcut_labels = false
sidebar_section = "none"
hidden_tabs = [ "monitor", "system", "power", "network", "screen-time" ]
width = 730

    [[control_center.shortcuts]]
    type = "nightlight"

    [control_center.calendar]
    show_events_card = false

[desktop_widgets]
schema_version = 2

[dock]
active_monitor_only = true
auto_hide = false
enabled = true
pinned = [ "bitwarden", "tutanota-desktop", "zen", "pcmanfm-qt", "steam", "vesktop" ]
position = "top"
reserve_space = false
show_dots = true
show_instance_count = false
smart_auto_hide = true

[hot_corners.top_left]
action = "window_switcher"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [
    "lockscreen-login-box@HDMI-A-1",
    "lockscreen-login-box@DP-2"
]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
    box_height = 70.0
    box_width = 400.0
    cx = 960.0
    cy = 961.0
    output = "DP-2"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 540.0
    cy = 1801.0
    output = "HDMI-A-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true

[nightlight]
enabled = true
temperature_night = 4000

[notification]
history_retention_hours = 72
background_opacity = 0.79999998211860657

[osd.kinds]
brightness = false
caffeine = false
dnd = false
keyboard_backlight = false
keyboard_layout = false
lock_keys = false
media = false
nightlight = false
power_profile = false
wifi = false

[plugin_settings."nightwatch75/file-search"]
exclude_dirs = "downgrade, .cargo, mnt, Cos, wolf, mv_games, mozilla, chromium, retroarch, goldendict, queens, xqueens, blender_org, spicetify, BraveSoftware, .local, Spotify, bin, srv, dev, lib, boot, lib64, opt, ssl, ca-certificates, .mednafen, tutanota-desktop, Bitwarden, unity3d, proc, lost+found, root, run, sbin, tmp, var, usr, Screenshots, vesktop, .mozilla, sys, umu, {}, VN, RPG, Steam, .pki, .var, .java, .cmake, .wine, Games, .moc, .gnupg, .zen, .mono, .git, node_modules, .cache, .venv"
search_folder = "/"
show_hidden = true

[plugin_settings."noctalia/notes"]
extension = "txt"
panel_open_near_click = true
panel_placement = "floating"
panel_position = "bottom_right"

[plugins]
enabled = [ "noctalia/notes", "noctalia/timer", "dunarand/bookmarks", "nightwatch75/file-search" ]

[shell]
clipboard_confirm_clear_history = false
clipboard_history_max_entries = 150
font_family = "IBM Plex Sans Medm"
polkit_agent = true
settings_show_advanced = false
show_location = false

    [shell.animation]
    speed = 1.10

    [shell.launcher.providers.calculator]
    prefix = ""

    [shell.launcher.providers.emoji]
    global = false
    prefix = "e"

    [shell.launcher.providers.wallpaper]
    prefix = ""

    [shell.launcher.providers.windows]
    global = true
    prefix = "w"

    [shell.panel]
    clipboard_placement = "attached"
    launcher_placement = "attached"
    open_near_click_clipboard = true
    open_near_click_control_center = true
    open_near_click_launcher = true
    polkit_placement = "attached"
    polkit_position = "auto"
    transparency_mode = "soft"

    [shell.screenshot]
    pipe_command = "SS_FOLDER=/bog/Screenshots/$(date +%Y-%m); mkdir -p $SS_FOLDER && cat > \"$SS_FOLDER/$(tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 7; echo .png)\""
    pipe_to_command = true
    save_to_file = false

    [[shell.session.actions]]
    action = "command"
    command = "pkill -x noctalia"
    countdown_seconds = 0.0
    enabled = true
    glyph = "door-exit"
    label = "Exit Noctalia"
    shortcut = "e"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "l"
    variant = "default"

    [[shell.session.actions]]
    action = "suspend"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "s"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "r"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    label = "Power Off"
    shortcut = "p"
    variant = "destructive"

[theme]
builtin = "Catppuccin"
community_palette = "Catppuccin Mocha Lavender"
mode = "dark"
source = "community"

[wallpaper]
enabled = true
fill_mode = "fit"
per_monitor_directories = true
transition = [ "fade" ]
transition_duration = 400

	[wallpaper.monitor.DP-2]
	directory = "/home/pyne/Pictures/Wallpapers/DP-2/"
	
	[wallpaper.monitor.HDMI-A-1]
	directory = "~/Pictures/Wallpapers/HDMI-A-1"

[widget.bar]
scale = 0.95000000000000007
show_idle_on_horizontal = false
type = "noctalia/timer:bar"

[widget.clock]
format = "{:%a %d・%H:%M}"
scale = 0.95

[widget.file-search]
type = "nightwatch75/file-search:file-search"

[widget.launcher]
capsule_padding = 0
glyph = "cat"
scale = 2.0

    [widget.launcher.actions]
    back  = "panel-toggle dunarand/bookmarks:panel"
    right = "panel-toggle launcher /fs"
	
[widget.media]
art_size = 22
capsule = true
capsule_opacity = 0.6
capsule_padding = 8
hide_when_no_media = true
max_length = 350
scroll_repeat = "steps"

    [widget.media.actions]
    back = "media previous-player"
    forward = "media next-player"
    middle = "panel-toggle launcher /bk aaa_"
    scroll_down = "media next"
    scroll_up = "media previous"

[widget.notes]
glyph = "notebook"
scale = 0.9
type = "noctalia/notes:notes"

[widget.notifications]
scale = 0.9

[widget.privacy]
hide_inactive = true
interactive = false
scale = 1.20

[widget.taskbar]
group_by_workspace = true
occupied_color = "surface"
scale = 1.40
show_workspace_label = false

[widget.tray]
drawer = true
pinned = [ "Fcitx" ]
scale = 0.9

[widget.volume]
show_label = false

[widget.weather]
show_condition = false

[widget.workspaces]
active_pill_size = 1.95
capsule = true
capsule_opacity = 0.6
capsule_padding = 8
empty_color = "outline"
inactive_pill_size = 1.10
occupied_color = "outline"
scroll_repeat = "steps"
show_labels = false