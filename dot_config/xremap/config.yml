modmap:
  - name: Apps to swap side button with the mouse wheel
    application:
      only: [pcsx2-qt,blender,/^steam_app_.*/,/.*\.exe/,steam_proton,gamescope]
    remap:
      BTN_EXTRA: BTN_MIDDLE
  - name: Granblue
    application:
      only: [steam_app_881020]
    remap:
      BTN_SIDE: Q
  - name: Music Player Search
    application:
      only: [mp]
    remap:
      BTN_SIDE: F12
  - name: Mahou Shoujo
    application:
      only: /^steam_app_.*/
    window:
      only: /新説魔法少女/
    remap:
      Esc: X
      BTN_EXTRA: F14

keymap:
   - name: Home Workspace
     remap:
       WIN-CAPSLOCK: WIN-INSERT
       WIN-SHIFT-CAPSLOCK: WIN-SHIFT-INSERT
   - name: Upscaler and Retroarch General config
     application:
       only: [xqueens,upscaler-overlay,com.libretro.RetroArch]
     remap:
       BTN_EXTRA: [WIN-X,WIN-S]
   - name: Pcmanfm
     application:
       only: [pcmanfm-qt]
     remap:
       CTRL-D: CTRL-L
       CTRL-SHIFT-F: CTRL-F
       CTRL-F: CTRL-I